<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Identification Flow Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Demo Text</h1>
    <p>Click the button below to start the identification/authentication flow. This will do a full-page redirect to the external authentication system.</p>
    <button id="start-btn">Start Identification</button>
  </div>

  <script>
    // Demo-only values — replace before production. See README.md.
    const IDENTIFICATION_ENTRY_URL = "https://onboarding.test.gcw.ng.telekom.net/identification-redirect";
    const DEFAULT_ASSIGNMENT_ID = "demo-assignment-123"; // PLACEHOLDER: used when no ?assignment_id= is given
    const assignmentId = new URLSearchParams(window.location.search).get("assignment_id") || DEFAULT_ASSIGNMENT_ID;

    document.getElementById("start-btn").addEventListener("click", () => {
      window.location.href = `${IDENTIFICATION_ENTRY_URL}/${assignmentId}`;
    });
  </script>
</body>
</html>
